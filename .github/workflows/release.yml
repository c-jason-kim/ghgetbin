name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate checksums
        run: |
          sha256sum ghgetbin > ghgetbin.sha256
          sha512sum ghgetbin > ghgetbin.sha512

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ghgetbin ghgetbin.sha256 ghgetbin.sha512 --title "${{ github.ref_name }}"
